<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>긴 SVG 연결선 회귀 fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #08110f; color: #edf8f4; font-family: sans-serif; }
    .deck { position: fixed; inset: 0; }
    .slide { position: absolute; inset: 0; display: flex; align-items: center; padding: 7vh 5vw 9vh; opacity: 0; visibility: hidden; }
    .slide.on { opacity: 1; visibility: visible; }
    .slide__inner { width: min(1160px, 100%); min-width: 0; margin: 0 auto; }
    .fc { display: block; width: 100%; height: auto; max-width: 100%; overflow: visible; }
    .fc .eg { fill: none; stroke: #36e59a; stroke-width: 3; stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset .2s linear; }
    .slide.on .fc .eg { stroke-dashoffset: 0; }
    @media (max-width: 820px) {
      body { overflow: auto; }
      .deck { position: static; }
      .slide { position: relative; min-height: 100dvh; opacity: 1; visibility: visible; padding: 6vh 6vw 10vh; }
      .slide__inner { width: 100%; min-width: 0; overflow-wrap: anywhere; }
    }
  </style>
</head>
<body>
  <div class="deck">
    <section class="slide slide--title" data-name="long-svg">
      <div class="slide__inner">
        <h1>긴 연결선도 한 줄로 이어진다</h1>
        <svg class="fc" viewBox="0 0 1600 260" role="img" aria-label="길이 1400인 연결선">
          <path class="eg" pathLength="1" d="M80 130 H1520"></path>
        </svg>
      </div>
    </section>
    <section class="slide slide--closing" data-name="mobile">
      <div class="slide__inner"><h2>모바일에서는 두 슬라이드가 세로로 보인다</h2></div>
    </section>
  </div>
  <script>
  (function () {
    var slides = Array.from(document.querySelectorAll('.slide'));
    var cur = -1;
    window.__deckSlides = slides;
    window.__deckGo = function (index) {
      if (cur >= 0) slides[cur].classList.remove('on');
      cur = index;
      slides[cur].classList.add('on');
      document.dispatchEvent(new CustomEvent('deck:change', { detail: { index: cur } }));
    };
    requestAnimationFrame(function () { requestAnimationFrame(function () { window.__deckGo(0); }); });
  })();
  </script>
  <script>
  (function () {
    window.__normalizeSvgEdges = function (root) {
      Array.from((root || document).querySelectorAll('.fc .eg')).forEach(function (edge) {
        if (typeof edge.getTotalLength === 'function') edge.setAttribute('pathLength', '1');
      });
    };
    window.__normalizeSvgEdges(document);
  })();
  </script>
</body>
</html>
